services:
  # Backend API (FastAPI)
  - type: web
    name: log-anomaly-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn log_anomaly.api.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LOG_ANOMALY_ENV
        value: production
      - key: LOG_ANOMALY_DATA_DIR
        value: data
      - key: LOG_ANOMALY_DATABASE_PATH
        value: data/log_anomaly.db
      - key: LOG_ANOMALY_MAX_UPLOAD_MB
        value: "25"
      - key: LOG_ANOMALY_GROUP_WINDOW_MINUTES
        value: "5"
      - key: LOG_ANOMALY_FRONTEND_ORIGIN
        fromService:
          type: web
          name: log-anomaly-frontend
          property: host

  # Frontend Dashboard (Next.js)
  - type: web
    name: log-anomaly-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
