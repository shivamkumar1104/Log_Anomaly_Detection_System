[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "log-anomaly-platform"
version = "0.1.0"
description = "An explainable log anomaly detection and alert grouping platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.3,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "plotly>=5.20,<8",
    "PyYAML>=6,<7",
    "charset-normalizer>=3.3,<4",
    "pypdf>=5,<7",
    "scikit-learn>=1.4,<2",
    "scipy>=1.12,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "openpyxl>=3.1,<4",
    "reportlab>=4.2,<5",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
